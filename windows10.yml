services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "10"
      USERNAME: ${WINDOWS_USERNAME:-Docker}
      PASSWORD: ${WINDOWS_PASSWORD:-admin}
      RAM_SIZE: ${RAM_SIZE:-6G}
      CPU_CORES: ${CPU_CORES:-2}
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
    volumes:
      # Windows itself: on the temporary disk, reinstalled each time the Codespace starts.
      - /tmp/windows-storage:/storage
      # Your files: kept between sessions. Shows up in Windows as the "Shared" folder.
      - ./shared:/shared
    devices:
      - /dev/kvm
      - /dev/net/tun
    stop_grace_period: 2m
    restart: always
